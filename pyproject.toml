[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veap-platform"
version = "0.1.0"
description = "Verifiable Embodied Agent Benchmark: reproducible simulation, independent evidence verification, and audit dashboard"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.28,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
veap = "veap.cli:main"

[tool.setuptools.packages.find]
include = ["veap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
