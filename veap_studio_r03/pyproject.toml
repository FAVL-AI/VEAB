[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "veap-studio"
version = "0.3.0"
description = "VEAP native multimodal engineering, replay and assurance studio"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.28,<1", "python-multipart>=0.0.9,<1", "Pillow>=9,<13"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
mcap = ["mcap>=1,<2", "mcap-ros2-support>=0.5,<1"]
geometry = ["trimesh>=4,<6"]
[tool.setuptools.packages.find]
include = ["veap_studio*"]
[tool.pytest.ini_options]
testpaths=["tests"]
