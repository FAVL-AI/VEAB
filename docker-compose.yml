services:
  veab:
    build: .
    environment:
      VEAB_DATA_DIR: /app/artifacts
      VEAB_ADMIN_TOKEN: ${VEAB_ADMIN_TOKEN:-}
      VEAB_ATTESTATION_KEY: ${VEAB_ATTESTATION_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - veab-evidence:/app/artifacts
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
volumes:
  veab-evidence:
