name: VEAP continuous verification
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Compile
        run: python -m compileall -q veap
      - name: Test
        run: python -m pytest -q
      - name: Offline smoke test
        run: |
          python -m veap run --scenario warehouse-transfer --policy route --seed 17 --out artifacts/ci-run.json
          python -m veap verify artifacts/ci-run.json
